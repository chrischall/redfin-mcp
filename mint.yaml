version: 1
name: Redfin
slug: redfin
summary: >-
  Redfin real-estate access for Claude — search listings, fetch property
  details, market reports, saved homes
#
# Hosting note (a comment, not user-facing summary text): this is a
# BROWSER-BRIDGE MCP — it reaches its site through the user's signed-in
# tab via the fetchproxy bridge. A bridged registration also needs runtime
# `fly-shared`, `bridge: true` and a `bridgePortEnv`, which are registration
# fields this manifest has no schema for (set them over the control API).
# `state.dataDir` below is required for `bridge`.
env:
  - name: REDFIN_WS_PORT
    required: false
    help: >-
      Override the fetchproxy WebSocket port (default 37149).
  - name: REDFIN_COMMUNITIES_FILE
    required: false
    help: >-
      Absolute path to a JSON array of community names, replacing the built-in
      vocabulary (which is specific to the Lake Lure / mountain-NC market).
      Set this to use this server in any other market.
  - name: REDFIN_DEBUG
    required: false
    help: >-
      Set to 1 to log verbose request detail to stderr.
state:
  dataDir: true
  reason: >-
    The fetchproxy identity lives at $HOME/.fetchproxy/identity/<name>.json
    and the pair code derives from it. Without a persistent $HOME every cold
    start mints a fresh identity and re-prompts pairing in the browser; the
    API refuses bridge without it.
egress:
  # Only hosts the SERVER process actually fetches. Hosts that appear
  # solely in a URL this server BUILDS and returns are excluded.
  #
  # Empty on purpose: this is a pure bridge MCP. Every redfin.com request
  # (www.redfin.com pages/APIs, the /robots.txt probe) runs as
  # window.fetch() in the user's signed-in tab via fetchproxy; the server
  # process only accepts the extension's loopback WebSocket and never
  # dials out itself. There is no direct (non-bridge) mode.
  # `ssl.cdn-redfin.com` and `www.redfin.com` appear only in photo URLs
  # and deep-links the tools BUILD and return.
  allow: []
